name: Mac 앱 빌드 · 엔진 시험

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 새로 올리면 앞의 실행은 멈춰요
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 이 저장소에 쓰지 않아요 (OpenUtau 릴리스 받기 · 아티팩트 올리기만)
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  app:
    name: EasyUtau.app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: OpenUtau (Mac) 받기
        env:
          GH_TOKEN: ${{ github.token }}
        run: devtools/get_openutau.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - run: swift --version
      - name: 앱 빌드 (엔진 + 화면)
        env:
          EASYUTAU_OPENUTAU: ${{ github.workspace }}/OpenUtau.app
        run: cd mac && ./build.sh
      - name: Apple Silicon · 인텔 Mac 둘 다 되는지
        run: |
          archs=$(lipo -archs mac/build/EasyUtau.app/Contents/MacOS/EasyUtau)
          echo "$archs"; [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
          ls -l mac/build/EasyUtau.app/Contents/Resources/engine/EasyUtauEngine.dll
          plutil -lint mac/build/EasyUtau.app/Contents/Info.plist
          # easyutau:// 주소로 AutoTuner에서 넘어올 수 있어야 해요
          plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes.0 raw mac/build/EasyUtau.app/Contents/Info.plist
      - name: 앱에 든 OpenUtau 엔진 (크기 · 뺀 화면용 파일)
        run: |
          host=mac/build/EasyUtau.app/Contents/Resources/engine/host
          test -x "$host/EasyUtauEngine" && test -f "$host/OpenUtau.Core.dll" && test -f "$host/OpenUtau.Plugin.Builtin.dll"
          python3 - "$host/BUNDLE.json" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          b = json.load(open(sys.argv[1]))
          print(f"### 앱에 든 엔진\nOpenUtau 폴더 {b['openutau_bytes']/1e6:.1f} MB → {b['bundle_bytes']/1e6:.1f} MB, "
                f"뺀 파일 {len(b['removed'])}개, .NET 설정 {b['gc']} {b['env']}\n")
          print("뺀 파일: " + ", ".join(b["removed"]))
          PY
          du -sh mac/build/EasyUtau.app
          codesign --verify --deep --strict mac/build/EasyUtau.app && echo "서명 확인 좋아요" || echo "::warning::서명 확인 경고"
      - name: 압축
        run: ditto -c -k --keepParent mac/build/EasyUtau.app EasyUtau-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EasyUtau-mac
          path: EasyUtau-mac.zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: EasyUtauEngine
          path: mac/build/engine/EasyUtauEngine.dll
          retention-days: 7

  unit:
    name: 음 높이 계산 시험
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: swift test (점 끌기 · 잇기/끊기 · 다듬기 · 가사 칸 ⌫)
        run: cd mac && swift test

  engine:
    name: 엔진 시험 (OpenUtau 없이, 실제 음원으로, 소리 재생 없음)
    # 다른 사람 저장소(포크)에서 온 PR에서는 테토 음원을 받지 않아요
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: app
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: pyyaml (AutoTuner가 쓰는 방식으로 저장 파일을 읽어 보려고)
        run: python -m pip install pyyaml
      - uses: actions/download-artifact@v4
        with:
          name: EasyUtau-mac
      - name: 앱 꺼내기 (OpenUtau는 받지 않아요)
        run: |
          ditto -x -k EasyUtau-mac.zip .
          test ! -e /Applications/OpenUtau.app && test ! -e OpenUtau.app && test ! -e ~/Library/OpenUtau/Singers
          echo "OpenUtau 없음 확인"
      - name: 테토 음원 받기 (공식 배포 · OpenUTAU용 통합 세트, 시험에만 쓰고 올리지 않아요)
        run: curl -fL --retry 3 -o teto.zip https://kasaneteto.jp/assets/download/utau/TETO-OUset240323.zip
      - name: 일본어 가사로 (음원도 엔진으로 넣기)
        env:
          EASYUTAU_TEST_INSTALL: teto.zip
        run: python devtools/engine_test.py "$PWD/EasyUtau.app/Contents/Resources/engine/host" out/ja | tee out-ja.txt
      - name: 한국어 가사로
        run: python devtools/engine_test.py "$PWD/EasyUtau.app/Contents/Resources/engine/host" out/ko "안,녕,하,세,요,노,을,아" | tee out-ko.txt
      - name: 결과 요약
        if: always()
        run: |
          { echo "### 엔진 시험 (OpenUtau 없이)"; echo '```'; grep -h "^RESULT\|발음 \|내보낸 소리\|음원 넣기" out-*.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: 결과 숫자만 올리기 (소리 파일은 올리지 않아요)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-test
          path: |
            out-*.txt
            out
            !out/**/*.wav
          retention-days: 14

  bench:
    name: 예전 방식과 비교 (시간 · 메모리 · CPU · 같은 소리인지)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: app
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install psutil
      - uses: actions/download-artifact@v4
        with:
          name: EasyUtau-mac
      - uses: actions/download-artifact@v4
        with:
          name: EasyUtauEngine
      - name: 앱 꺼내기 · 예전 방식(깔린 OpenUtau 복사본) 준비
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ditto -x -k EasyUtau-mac.zip .
          devtools/get_openutau.sh
          python devtools/engine_host.py "$PWD/OpenUtau.app" "$PWD/EasyUtauEngine.dll" "$PWD/old-host"
      - name: 테토 음원 (시험에만 쓰고 올리지 않아요)
        run: |
          curl -fL --retry 3 -o teto.zip https://kasaneteto.jp/assets/download/utau/TETO-OUset240323.zip
          python devtools/install_voicebank.py teto.zip
      - name: 비교
        run: |
          new="$PWD/EasyUtau.app/Contents/Resources/engine/host"
          plain="DOTNET_gcConcurrent=1,DOTNET_GCConserveMemory=0"
          python devtools/engine_bench.py --rounds 3 --out bench.json \
            "old=$PWD/old-host,EASYUTAU_REST_MS=30,$plain" \
            "app-plain=$new,EASYUTAU_REST_MS=30,$plain" \
            "app-rest=$new,$plain" \
            "app-noconcurrent=$new,DOTNET_gcConcurrent=0,DOTNET_GCConserveMemory=0" \
            "app=$new" | tee bench.txt
      - name: 결과 요약
        if: always()
        run: |
          { echo "### 예전 방식(old)과 앱에 든 엔진 비교 (가운데 값)"; sed -n '/^| /,$p' bench.txt; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-bench
          path: |
            bench.json
            bench.txt
          retention-days: 14
